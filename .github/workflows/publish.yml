name: Publish to NuGet

on:
  workflow_dispatch:

env:
  PROJECT_PATH: src/Blazor.TanStackVirtual/Blazor.TanStackVirtual.csproj
  SOLUTION_PATH: src/Blazor.TanStackVirtual.slnx
  PACKAGE_NAME: Kebechet.Blazor.TanStackVirtual
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: Release
  OUTPUT_PATH: ./nupkg
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PROJECT_PATH }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # GeneratePackageOnBuild means the build itself emits the .nupkg (and .snupkg) under
      # src/<Project>/bin/<Config>/, so a separate `dotnet pack` step is redundant - and a
      # standalone `dotnet pack` fails outright with NU5026.
      - name: Build (produces the .nupkg via GeneratePackageOnBuild)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --no-build --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Collect package
        run: |
          mkdir -p ${{ env.OUTPUT_PATH }}
          cp src/*/bin/${{ env.BUILD_CONFIGURATION }}/*.nupkg ${{ env.OUTPUT_PATH }}/
          cp src/*/bin/${{ env.BUILD_CONFIGURATION }}/*.snupkg ${{ env.OUTPUT_PATH }}/ || true
          ls -la ${{ env.OUTPUT_PATH }}

      # A package that publishes cleanly but ships no JS is broken at runtime, not at build time.
      # Fail the job here rather than on a consumer's machine.
      - name: Verify package carries its static web assets
        run: |
          PKG=$(find ${{ env.OUTPUT_PATH }} -name '*.nupkg' | head -1)
          CONTENTS=$(unzip -l "$PKG")
          echo "$CONTENTS"
          echo "$CONTENTS" | grep -q "staticwebassets/tanstack-virtual-core.js"     || { echo "::error::vendored virtual-core missing from package"; exit 1; }
          echo "$CONTENTS" | grep -q "staticwebassets/adaptive-virtualize-interop.js"   || { echo "::error::interop module missing from package"; exit 1; }
          echo "$CONTENTS" | grep -q "build/Kebechet.Blazor.TanStackVirtual.props"  || { echo "::error::build props missing from package"; exit 1; }

      - name: Publish to NuGet
        run: dotnet nuget push ${{ env.OUTPUT_PATH }}/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source ${{ env.NUGET_SOURCE }} --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push ${{ env.OUTPUT_PATH }}/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## ${{ env.PACKAGE_NAME }} v${{ steps.version.outputs.version }}

            ### Installation
            ```bash
            dotnet add package ${{ env.PACKAGE_NAME }} --version ${{ steps.version.outputs.version }}
            ```

            ### Links
            - [NuGet Package](https://www.nuget.org/packages/${{ env.PACKAGE_NAME }}/${{ steps.version.outputs.version }})
            - [GitHub](https://github.com/Kebechet/Blazor.TanStackVirtual)
          files: ${{ env.OUTPUT_PATH }}/*.nupkg
          generate_release_notes: true
